<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1e1a1f" />
<title>valo Link · швидка передача</title>
<style>
  :root { --bg: #1e1a1f; --fg: #f5e6ea; --accent: #f2a7bb; --muted: #9c8a93; --chip: color-mix(in srgb, var(--bg) 88%, var(--fg)); --hi: color-mix(in srgb, var(--bg) 78%, var(--fg)); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { padding: calc(18px + env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
  h1 { font-family: Gabriola, Georgia, serif; font-weight: 400; font-size: 36px; color: var(--accent); line-height: 1; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--chip); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  button { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 14px; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 700; }
  button.alt { background: var(--hi); color: var(--fg); }
  .file { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--hi); color: var(--fg); text-decoration: none; }
  .file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file small { color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--hi); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #files { display: flex; flex-direction: column; gap: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>valo Link</h1>
  <div class="sub" id="sub">Підключаюся до комп'ютера…</div>

  <div class="card" id="send" hidden>
    <h3>Файли з комп'ютера</h3>
    <div id="files"></div>
    <button id="all" hidden>Завантажити все</button>
  </div>

  <div class="card" id="recv" hidden>
    <h3>Надіслати на комп'ютер</h3>
    <button id="pick">Обрати файли або фото</button>
    <button class="alt" id="cam">Сфотографувати</button>
    <input type="file" id="fileIn" multiple hidden />
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden />
    <div class="bar"><i id="prog"></i></div>
    <div class="sub" id="upMsg">Файли з'являться на ПК у «Завантаження\valo Link».</div>
  </div>

  <div class="card" id="dead" hidden><h3>Посилання не діє</h3><div class="sub">Воно діє 15 хвилин. Створіть новий QR-код у valo Link на комп'ютері.</div></div>
  <div class="sub" id="left"></div>

<script>
  const $ = id => document.getElementById(id);
  const base = location.pathname.replace(/\/+$/, '');
  const size = n => n > 1e9 ? (n / 1e9).toFixed(1) + ' ГБ' : n > 1e6 ? (n / 1e6).toFixed(1) + ' МБ' : Math.max(1, Math.round(n / 1e3)) + ' КБ';
  let until = 0;
  function theme(t) {
    if (!t) return; const r = document.documentElement.style;
    for (const k of ['bg', 'fg', 'accent', 'muted']) r.setProperty('--' + k, t[k]);
    document.querySelector('meta[name=theme-color]').content = t.bg;
  }
  async function load() {
    let j;
    try { const r = await fetch(base + '/info'); j = await r.json(); if (!r.ok) throw 0; }
    catch { $('sub').textContent = ''; $('dead').hidden = false; $('send').hidden = $('recv').hidden = true; $('left').textContent = ''; return; }
    theme(j.theme); until = Date.now() + j.left;
    $('sub').textContent = 'Комп\'ютер «' + j.pc + '» · без підключення, одноразове посилання';
    if (j.mode === 'send') {
      $('send').hidden = false; const box = $('files'); box.innerHTML = '';
      for (const f of j.files) {
        const a = document.createElement('a'); a.className = 'file'; a.href = base + '/f/' + f.n; a.download = f.name;
        a.innerHTML = '<b>⬇</b><span></span><small></small>'; a.querySelector('span').textContent = f.name; a.querySelector('small').textContent = size(f.size);
        box.append(a);
      }
      $('all').hidden = j.files.length < 2;
      $('all').onclick = () => { let i = 0; for (const a of box.querySelectorAll('a')) setTimeout(() => a.click(), 700 * i++); };
    } else $('recv').hidden = false;
  }
  setInterval(() => {
    if (!until) return; const ms = until - Date.now();
    if (ms <= 0) { load(); until = 0; return; }
    $('left').textContent = 'Посилання діє ще ' + Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0');
  }, 1000);

  async function upload(files) {
    let done = 0, fail = 0;
    for (const f of files) {
      $('upMsg').textContent = `Надсилаю ${f.name}…`;
      await new Promise(res => {
        const x = new XMLHttpRequest();
        const name = f.name && f.name !== 'image.jpg' ? f.name : 'Фото ' + new Date().toISOString().slice(0, 19).replace('T', ' ').replace(/:/g, '-') + '.jpg';
        x.open('POST', base + '/up?name=' + encodeURIComponent(name));
        x.upload.onprogress = e => { if (e.lengthComputable) $('prog').style.width = ((done + fail + e.loaded / e.total) / files.length * 100) + '%'; };
        x.onload = () => { x.status === 200 ? done++ : fail++; res(); };
        x.onerror = () => { fail++; res(); };
        x.send(f);
      });
    }
    $('prog').style.width = '100%';
    $('upMsg').textContent = fail ? `Надіслано ${done}, не вдалося ${fail}` : `Надіслано: ${done} — у «Завантаження\\valo Link» на ПК`;
    setTimeout(() => $('prog').style.width = '0', 1500);
  }
  $('pick').onclick = () => $('fileIn').click();
  $('cam').onclick = () => $('camIn').click();
  $('fileIn').onchange = () => { upload([...$('fileIn').files]); $('fileIn').value = ''; };
  $('camIn').onchange = () => { upload([...$('camIn').files]); $('camIn').value = ''; };
  load();
</script>
</body>
</html>
