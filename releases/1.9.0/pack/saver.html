<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #clock { position: fixed; left: 7vw; bottom: 16vh; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-weight: 200;
    line-height: 1; letter-spacing: -2px; pointer-events: none; transition: opacity .6s; text-shadow: 0 2px 30px rgba(0,0,0,.25); }
  #clock b { display: block; font-weight: 200; font-size: 15vh; }
  #clock span { display: block; font-size: 2.6vh; letter-spacing: 3px; margin-top: 1.4vh; opacity: .75; text-transform: lowercase; }
  #clock.off { opacity: 0; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; transition: opacity 1.2s; pointer-events: none; }
  #fade.in { opacity: 0; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="clock" class="off"><b id="time"></b><span id="date"></span></div>
  <div id="fade"></div>
  <script type="module">
    // valo.os screensaver: the theme's live wallpaper scene with a clock, shown by the helper after N idle minutes
    import * as zebar from './zebar.js';
    import { getTheme } from './themes.js';
    const win = zebar.currentWidget().tauriWindow;
    const IDS = ['sakura', 'night', 'matcha', 'latte', 'graphite', 'sunset'];
    let loaded = false, on = false;
    function themeIndex() { const i = IDS.indexOf(getTheme().id); return i < 0 ? 0 : i; }
    function load() {
      if (loaded) return;
      loaded = true;
      window.VALO_THEME = IDS[themeIndex()];
      const s = document.createElement('script'); s.src = './saver-scene.js';
      s.onload = () => { window.livelyPropertyListener?.('clock', true); window.livelyPropertyListener?.('parallax', false); };
      document.body.append(s);
    }
    async function show() {
      if (on) return; on = true;
      load();
      window.livelyPropertyListener?.('theme', themeIndex());
      try { await win.show(); } catch { }
      requestAnimationFrame(() => document.getElementById('fade').classList.add('in'));
    }
    async function hide() {
      if (!on) return; on = false;
      document.getElementById('fade').classList.remove('in');
      try { await win.hide(); } catch { }
    }
    window.addEventListener('storage', e => {
      if (e.key !== 'valo.ev.idle' || !e.newValue) return;
      try { JSON.parse(e.newValue).on ? show() : hide(); } catch { }
    });
    for (const ev of ['mousedown', 'keydown']) window.addEventListener(ev, hide);
    try { win.hide(); } catch { }
  </script>
</body>
</html>
